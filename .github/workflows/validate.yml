name: Validate harvester and compliance data

on:
  pull_request:
    paths:
      - '.github/workflows/harvest.yml'
      - '.github/workflows/validate.yml'
      - '.gitattributes'
      - '.gitignore'
      - '.npmrc'
      - 'data/**'
      - 'lib/**'
      - 'registry/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate registry and all stored data
        run: npm run validate
